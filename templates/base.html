<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MyStore{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('products') }}" class="logo">my<span class="purple-dot">store</span>.</a>
    <nav>
      {% if session.get('username') %}
        <a href="{{ url_for('products') }}">Shop</a>
        <a href="{{ url_for('cart') }}">Cart</a>
        <a href="{{ url_for('get_products') }}">Add product</a>
        <a href="{{ url_for('logout') }}">Hi, {{ session['username'] }} (Logout)</a>
      {% else %}
        <a href="{{ url_for('login') }}">Sign in</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
