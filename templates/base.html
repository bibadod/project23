<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MyStore{% endblock %}</title>
  <style>
    :root { --primary: #7554d9; --bg: #f9f8fc; --card-bg: #ffffff; --border-color: #e8e5ef; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: var(--bg); color: #222; }
    header { background: #fff; border-bottom: 1px solid var(--border-color); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header a { text-decoration: none; color: #222; font-weight: bold; }
    nav a { margin-left: 15px; color: #555; text-decoration: none; }
    main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .purple-dot { color: var(--primary); }
    .button { background: var(--primary); color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; display: inline-block; }
    .button-full { width: 100%; box-sizing: border-box; text-align: center; }
    .outline-button { border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 8px; text-decoration: none; color: #333; }
    .alert-error { background: #ffebeb; color: #c00; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; }
    .form-stack { display: flex; flex-direction: column; gap: 12px; }
    .form-stack input, .form-stack textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font: inherit; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
    .product-picture img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
    .image-placeholder { height: 160px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('products') }}">MY<span class="purple-dot">STORE</span></a>
    <nav>
      {% if session.get('username') %}
        <a href="{{ url_for('products') }}">Товары</a>
        <a href="{{ url_for('cart') }}">Корзина</a>
        <a href="{{ url_for('get_products') }}">Добавить товар</a>
        <a href="{{ url_for('logout') }}">Выйти ({{ session['username'] }})</a>
      {% else %}
        <a href="{{ url_for('login') }}">Войти</a>
        <a href="{{ url_for('register') }}">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
